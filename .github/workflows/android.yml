name: Android

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  # TEMPORARY (debug): write is for the lockfile refresh commit and the
  # diagnostics comment. Revert to contents: read before merging.
  contents: write
  pull-requests: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # xbuild is unpublished (crates.io still carries the unrelated 0.2.0 from
  # 2022), so CI installs it from git at this revision.
  XBUILD_REV: e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1

jobs:
  apk:
    name: release APK (arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Android target
        run: rustup target add aarch64-linux-android
      # After the toolchain, so the cache key follows the pinned rustc. See
      # ci.yml for why each job sets its own generation.
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-generation: android-v1
      # Build scripts (ring's C compilation) need an Android C compiler;
      # the check below does no linking, so no linker configuration. The
      # runner image already ships the SDK's command-line tools; only the
      # NDK itself is installed.
      - name: Install Android NDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          export PATH="$SDK/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "ndk;27.0.12077973" 2>&1 | tail -3
          NDK="$SDK/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "$NDK" >> "$GITHUB_PATH"
          echo "CC_aarch64_linux_android=$NDK/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          "$NDK/aarch64-linux-android24-clang" --version | head -1
      # TEMPORARY (debug): the lockfile is missing 15 wgpu-tree packages
      # (pre-existing staleness); regenerate it for this job and commit it
      # to the branch. Delete the step before merging (keep Cargo.lock).
      - name: Refresh lockfile (temporary)
        if: github.event.pull_request.number
        run: |
          cp Cargo.lock /tmp/Cargo.lock.orig
          cargo update -w > /tmp/update-w.log 2>&1
          tail -5 /tmp/update-w.log
          if git diff --quiet -- Cargo.lock; then
            echo "lockfile already fresh"
          else
            cp Cargo.lock /tmp/Cargo.lock.new
            git fetch origin "${{ github.head_ref }}:${{ github.head_ref }}" --depth 1
            git checkout "${{ github.head_ref }}"
            cp /tmp/Cargo.lock.new Cargo.lock
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -am "Regenerate Cargo.lock (add 15 missing wgpu-tree packages)"
            git push origin "${{ github.head_ref }}"
          fi
      # The fast signal: the same library xbuild compiles, before the slow
      # release build below. MilkDrop stays off: its C++ build has no
      # Android toolchain wiring.
      - name: Clippy (aarch64-linux-android)
        run: |
          mbx clippy --locked --lib --no-default-features --target aarch64-linux-android -- -D warnings 2>&1 | tee /tmp/clippy.log
          status="${PIPESTATUS[0]}"
          echo "CLIPPY_STATUS=$status" >> "$GITHUB_ENV"
          exit "$status"
      # Building xbuild takes minutes; the binary is cached by revision and
      # the install skipped on a hit. The key also covers our manifest
      # patch (services support), applied below before installing.
      - name: Cache xbuild
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/x
          key: xbuild-${{ env.XBUILD_REV }}-${{ hashFiles('tools/xbuild-services.patch') }}
      - name: Install xbuild
        run: |
          if ! command -v x >/dev/null; then
            rm -rf "$RUNNER_TEMP/xbuild"
            git init -q "$RUNNER_TEMP/xbuild"
            git -C "$RUNNER_TEMP/xbuild" remote add origin https://github.com/rust-mobile/xbuild.git
            git -C "$RUNNER_TEMP/xbuild" fetch -q --depth 1 origin "$XBUILD_REV"
            git -C "$RUNNER_TEMP/xbuild" checkout -q FETCH_HEAD
            git -C "$RUNNER_TEMP/xbuild" apply "$GITHUB_WORKSPACE/tools/xbuild-services.patch"
            cargo install --path "$RUNNER_TEMP/xbuild/xbuild"
          fi
          x --version
      # Without a signing key the APK carries xbuild's debug signature:
      # installable, but not Play-uploadable. Set the ANDROID_SIGNING_PEM
      # repository secret (a PEM-encoded RSA key and certificate) to sign
      # release builds for distribution instead.
      - name: Build release APK
        run: |
          args=(--platform android --arch arm64 --format apk --release --no-default-features)
          if [ -n "${{ secrets.ANDROID_SIGNING_PEM }}" ]; then
            echo "${{ secrets.ANDROID_SIGNING_PEM }}" > "$RUNNER_TEMP/signing.pem"
            args+=(--pem "$RUNNER_TEMP/signing.pem")
          fi
          x build "${args[@]}" 2>&1 | tee /tmp/xbuild.log
          status="${PIPESTATUS[0]}"
          echo "XBUILD_STATUS=$status" >> "$GITHUB_ENV"
          exit "$status"
      # The debug signing identity must survive across runs, or every APK
      # needs an uninstall first. (Release PEM builds don't use it.)
      - name: Cache debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1
      # The sign-in keepalive is Java, and xbuild is Rust-only: compile the
      # service, add its classes.dex to the APK in place, then realign and
      # re-sign with the same identity xbuild used (debug keystore above,
      # or the release PEM). Debug identity differs from xbuild's own, so
      # installs over older APKs need one uninstall first.
      - name: Merge keepalive DEX
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          BT="$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)"
          JAR="$(ls -d "$SDK"/platforms/android-* | sort -t- -k2 -n | tail -1)/android.jar"
          command -v javac zip
          KEEP="$RUNNER_TEMP/keepalive"
          rm -rf "$KEEP" && mkdir -p "$KEEP/classes" "$KEEP/merged"
          javac -source 8 -target 8 -nowarn -cp "$JAR" -d "$KEEP/classes" android/AuthKeepaliveService.java
          APK=(target/x/release/android/*.apk)
          APK_ABS="$GITHUB_WORKSPACE/${APK[0]}"
          if unzip -l "$APK_ABS" | grep -q 'classes\.dex'; then
            mkdir -p "$KEEP/orig" && (cd "$KEEP/orig" && unzip -o -q "$APK_ABS" classes.dex)
            "$BT/d8" --release --min-api 26 --output "$KEEP/merged" "$KEEP/orig/classes.dex" "$KEEP/classes/rocks/spotifast/spotifast/AuthKeepaliveService.class"
          else
            "$BT/d8" --release --min-api 26 --output "$KEEP/merged" "$KEEP/classes/rocks/spotifast/spotifast/AuthKeepaliveService.class"
          fi
          (cd "$KEEP/merged" && zip -g -q "$APK_ABS" classes.dex)
          "$BT/zipalign" -f 4 "$APK_ABS" "$KEEP/aligned.apk" && mv "$KEEP/aligned.apk" "$APK_ABS"
          if [ -n "${{ secrets.ANDROID_SIGNING_PEM }}" ]; then
            openssl pkcs12 -export -in "$RUNNER_TEMP/signing.pem" -out "$KEEP/signing.p12" -passout pass:spotifast -name spotifast
            "$BT/apksigner" sign --ks "$KEEP/signing.p12" --ks-pass:pass:spotifast --ks-key-alias spotifast "$APK_ABS"
          else
            KS=~/.android/debug.keystore
            [ -f "$KS" ] || keytool -genkeypair -keystore "$KS" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10950 -dname "CN=Android Debug,O=Android,C=US"
            "$BT/apksigner" sign --ks "$KS" --ks-pass:pass:android --ks-key-alias androiddebugkey --key-pass:pass:android "$APK_ABS"
          fi
          "$BT/apksigner" verify "$APK_ABS" && echo "signature OK"
      - name: Inspect APK
        run: |
          apk=(target/x/release/android/*.apk)
          unzip -l "${apk[0]}" | tee "$RUNNER_TEMP/apk-contents.txt"
          grep -q 'lib/arm64-v8a/libspotifast\.so' "$RUNNER_TEMP/apk-contents.txt"
          grep -qF 'classes.dex' "$RUNNER_TEMP/apk-contents.txt"
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          BT="$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)"
          "$BT/aapt" dump xmltree "${apk[0]}" AndroidManifest.xml | grep -q 'AuthKeepaliveService'
          ls -la "${apk[0]}"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: spotifast-android-arm64
          path: target/x/release/android/*.apk
      # TEMPORARY (debug): report the fmt diff, the clippy and xbuild
      # errors, and a desktop lib-test probe as a PR comment. Runs last so
      # every log above exists. Delete before merging.
      - name: Report diagnostics (temporary)
        if: always() && github.event.pull_request.number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Must-post: never die before the gh comment, whatever failed above.
          set +e
          rustup component add rustfmt
          fault=0
          cargo fmt --all --check > /tmp/fmt.log 2>&1 || fault=1
          [ "${CLIPPY_STATUS:-1}" != "0" ] && fault=1
          [ "${XBUILD_STATUS:-1}" != "0" ] && fault=1
          ls target/x/release/android/*.apk >/dev/null 2>&1 || fault=1
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpulse-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libclang-dev
          mbx test --locked --lib --no-default-features > /tmp/host-test.log 2>&1 || fault=1
          diff /tmp/Cargo.lock.orig Cargo.lock > /tmp/lock-diff.log 2>&1 || true
          if [ "$fault" = "0" ]; then exit 0; fi
          {
            echo '## diagnostics (temporary debug step)'
            echo
            echo '### fmt'
            echo '```diff'
            head -250 /tmp/fmt.log 2>/dev/null || echo '(no fmt log)'
            echo '```'
            echo
            echo '### android clippy (tail)'
            echo '```'
            tail -120 /tmp/clippy.log 2>/dev/null || echo '(no clippy log: step skipped)'
            echo '```'
            echo
            echo '### xbuild release APK (tail)'
            echo '```'
            tail -150 /tmp/xbuild.log 2>/dev/null || echo '(no xbuild log: step skipped)'
            echo '```'
            echo
            echo '### NDK state'
            echo '```'
            echo "CC_aarch64_linux_android=${CC_aarch64_linux_android:-<unset>}"
            ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null || echo '(no $ANDROID_HOME/ndk/*)'
            command -v aarch64-linux-android24-clang 2>/dev/null || echo '(clang not on PATH)'
            echo '```'
            echo
            echo '### desktop lib tests (tail)'
            echo '```'
            tail -20 /tmp/host-test.log 2>/dev/null || echo '(no host-test log)'
            echo '```'
            echo
            echo '### cargo update -w'
            echo '```'
            tail -20 /tmp/update-w.log 2>/dev/null || echo '(no update-w log: refresh skipped or failed)'
            echo '```'
            echo
            echo '### Cargo.lock delta (truncated at 150 lines)'
            echo '```diff'
            head -150 /tmp/lock-diff.log 2>/dev/null || echo '(no lock-diff log)'
            echo '```'
          } > /tmp/diag.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/diag.md
